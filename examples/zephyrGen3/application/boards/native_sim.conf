CONFIG_SERIAL=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# native_sim logs directly to stdout by default (LOG_BACKEND_NATIVE_POSIX), and
# so logging to the console UART (uart0) – which is also connected to
# stdin/stdout – will just result in duplicate log messages.
CONFIG_LOG_BACKEND_UART=n
