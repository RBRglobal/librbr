# Read the Docs build configuration.
#
# Read the Docs runs Sphinx directly rather than via docs/Makefile, so
# Doxygen is run here first to produce the XML consumed by Breathe.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - cd docs && doxygen Doxyfile

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
