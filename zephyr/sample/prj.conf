# Sample configuration for RBR library
CONFIG_LIBRBR=y
CONFIG_LIBRBR_DYNAMIC_CORRECTION=n
CONFIG_LIBRBR_LOG_LEVEL=3

# Basic Zephyr configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable serial/UART for instrument communication
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y